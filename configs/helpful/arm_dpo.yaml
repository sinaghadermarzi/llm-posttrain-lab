# Arm DPO: offline preference optimization from pi_SFT (reference = pi_SFT).
# beta is the implicit KL knob; sweep values come from sweeps.yaml (CLI override:
#   python -m posttrain_lab.train.dpo ... train.beta=0.1).
task: helpful
stage: dpo
run_name: dpo-beta${train.beta}
output_dir: ${results_root}/runs/dpo_beta${train.beta}_seed${seed}
init_from: ${paths.sft_base}

data:
  split: train_prefs
  max_samples: 20000

train:
  beta: 0.1
  # math showed 5e-7 x 1 epoch barely moves and 5e-6 x 2 epochs collapses
  # (configs/math/m3_arm_dpo.yaml); 2e-6 x 1 epoch over 20k pairs (~312 steps)
  # is about the math DPO arm's budget
  learning_rate: 2.0e-6
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  num_train_epochs: 1
  max_length: 1536
  truncation_mode: keep_end
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 16  # 1 GPU per run (sweep runs in parallel) -> effective 64
  save_strategy: steps
  save_steps: 0.1                  # 10 checkpoints per run
