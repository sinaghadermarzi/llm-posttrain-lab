# Stage 2: train the reward model (scalar head on pi_SFT) on preference pairs.
# Gate: pairwise accuracy on test_prefs must be >= min_accuracy or the pipeline aborts.
task: helpful
stage: rm
run_name: rm
output_dir: ${results_root}/runs/rm_seed${seed}
init_from: ${paths.sft_base}

data:
  split: train_prefs
  eval_split: test_prefs
  max_samples: 40000

train:
  max_length: 2048
  learning_rate: 1.0e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  num_train_epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4   # x4 GPUs -> effective 64
  center_rewards_coefficient: 0.01
  save_strategy: epoch

min_accuracy: 0.65                 # expect ~0.70-0.75
