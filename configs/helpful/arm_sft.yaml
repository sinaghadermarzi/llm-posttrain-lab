# Arm SFT: preference alignment by pure imitation — continued SFT on the *chosen*
# responses of the preference split. No KL knob exists; the frontier curve is
# traced by checkpoints over training. That absence is the point of the experiment.
task: helpful
stage: sft
run_name: arm-sft
output_dir: ${results_root}/runs/sft_seed${seed}
init_from: ${paths.sft_base}

data:
  split: train_prefs
  use_chosen_as_sft: true
  max_samples: 20000

train:
  max_length: 2048
  learning_rate: 1.0e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  num_train_epochs: 3
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  packing: false                 # keep 1 example = 1 sequence so ckpt spacing tracks examples seen
  save_strategy: steps
  save_steps: 0.08333            # fraction of total steps -> ~12 ckpts over 3 epochs (~0.25 epoch each)
