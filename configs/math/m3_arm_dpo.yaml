# Math arm DPO: offline preference optimization on the self-generated pairs
# from m2 (run gen_pairs first). ref = pi_SFT-math (snapshot of init).
# Sweep via configs/math/sweeps.yaml (CLI: train.beta=0.1).
task: math
stage: dpo
run_name: dpo-math-beta${train.beta}
output_dir: ${results_root}/runs/dpo_beta${train.beta}_seed${seed}
init_from: ${paths.sft_base}

data:
  split: train                   # split of the pairs DatasetDict
  max_samples: null

train:
  beta: 0.1
  learning_rate: 5.0e-7
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  num_train_epochs: 1
  max_length: 1024
  truncation_mode: keep_end
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 16  # 1 GPU per run (sweep in parallel) -> effective 64
  save_strategy: steps
  save_steps: 0.2                  # 5 checkpoints per run
