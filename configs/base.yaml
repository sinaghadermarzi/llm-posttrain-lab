# Shared settings, merged under every stage config (stage yaml wins on conflict).
seed: 17
results_root: results

dataset:
  id: HuggingFaceH4/ultrafeedback_binarized

model:
  base: Qwen/Qwen2.5-1.5B          # escape hatch: Qwen/Qwen2.5-1.5B-Instruct (then skip stage 1)
  dtype: bfloat16
  attn_implementation: flash_attention_2   # set to "sdpa" if flash-attn is not installed

# Canonical artifact locations consumed by later stages.
paths:
  sft_base: ${results_root}/runs/sft-base_seed${seed}
  reward_model: ${results_root}/runs/rm_seed${seed}

# Defaults forwarded into every TRL *Config (TrainingArguments subclass).
train:
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  save_only_model: true            # weight-only checkpoints (~3GB each at 1.5B)
  save_total_limit: null
  report_to: wandb
  remove_unused_columns: false

wandb:
  project: llm-posttrain-lab
  mode: offline                    # set WANDB_MODE=online (or edit) to sync
