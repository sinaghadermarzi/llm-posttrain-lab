# Arm GRPO: online RL from pi_SFT with the stage-2 reward model, group-relative
# advantages (no value model). beta is the KL coefficient; sweep via sweeps.yaml
# (CLI: train.beta=0.04). beta=0.0 traces the "unconstrained RL" cautionary curve.
stage: grpo
run_name: grpo-beta${train.beta}
output_dir: ${results_root}/runs/grpo_beta${train.beta}_seed${seed}
init_from: ${paths.sft_base}
reward_model_path: ${paths.reward_model}

data:
  split: train_gen
  max_samples: 8000
  max_prompt_length: 512

train:
  beta: 0.04
  learning_rate: 1.0e-6
  num_train_epochs: 1
  num_generations: 8
  per_device_train_batch_size: 8   # must be divisible into num_generations groups
  gradient_accumulation_steps: 2
  max_completion_length: 512
  temperature: 1.0
  use_vllm: true
  vllm_mode: colocate
  vllm_gpu_memory_utilization: 0.25
  save_strategy: steps
  save_steps: 0.2                  # 5 checkpoints per run
