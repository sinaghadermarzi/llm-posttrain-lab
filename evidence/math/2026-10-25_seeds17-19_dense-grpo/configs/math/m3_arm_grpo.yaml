# Math arm GRPO: online RL from pi_SFT-math with the VERIFIABLE reward
# (exact answer match, tasks/gsm8k.py) — no reward model anywhere.
# beta=0.0 in the sweep traces the unconstrained-RL cautionary curve.
task: math
stage: grpo
run_name: grpo-math-beta${train.beta}
output_dir: ${results_root}/runs/grpo_beta${train.beta}_seed${seed}
init_from: ${paths.sft_base}
reward: verifier

data:
  split: train
  max_samples: null

train:
  beta: 0.04
  learning_rate: 1.0e-6
  num_train_epochs: 1
  num_generations: 8
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  max_completion_length: 320
  temperature: 1.0
  use_vllm: true
  vllm_mode: colocate
  vllm_gpu_memory_utilization: 0.25
  save_strategy: steps
  save_steps: 0.1                  # 10 checkpoints per run, as DPO: matched-KL comparisons need them
