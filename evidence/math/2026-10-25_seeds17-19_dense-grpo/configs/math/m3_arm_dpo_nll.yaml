# Math arm DPO+NLL (IRPO / RPO style): the DPO arm's loss plus the token-mean
# NLL of the chosen (correct) answer, weight 1. Pure DPO on self-generated
# pairs lowers the likelihood of the correct answers along with the wrong
# ones and its accuracy collapses (m3_arm_dpo.yaml history); the NLL term
# keeps the chosen answers likely. Same pairs, reference, budget and beta
# grid as the DPO arm, so the two compare directly.
# Sweep via configs/math/sweeps.yaml (dpo_nll; CLI: train.beta=0.1).
task: math
stage: dpo
run_name: dpo-nll-math-beta${train.beta}
output_dir: ${results_root}/runs/dpo-nll_beta${train.beta}_seed${seed}  # arm = 'dpo-nll' (run_arm)
init_from: ${paths.sft_base}

data:
  split: train                   # split of the pairs DatasetDict
  max_samples: null

train:
  beta: 0.1
  loss_type: [sigmoid, sft]        # DPO + NLL on chosen (TRL 1.7 multi-loss)
  loss_weights: [1.0, 1.0]
  # budget: identical to m3_arm_dpo.yaml (see its history)
  learning_rate: 2.0e-6
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  num_train_epochs: 2
  max_length: 1024
  truncation_mode: keep_end
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 16  # 1 GPU per run (sweep in parallel) -> effective 64
  save_strategy: steps
  save_steps: 0.1                  # 10 checkpoints per run (eval traces the frontier through them)
